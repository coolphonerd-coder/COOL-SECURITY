<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POS | COOL SECURITY</title><link rel="stylesheet" href="pos.css"></head>
<body><div id="loginScreen" class="login-screen"><form id="loginForm"><img src="assets/logo-cool-security.png" alt="COOL SECURITY"><h1>Acceso administrativo</h1><p>Inicia sesión para administrar pedidos e inventario.</p><label>Correo electrónico<input id="loginEmail" type="email" required autocomplete="username"></label><label>Contraseña<input id="loginPassword" type="password" required autocomplete="current-password"></label><button type="submit">Entrar al POS</button><small id="loginMessage"></small></form></div><aside><img src="assets/logo-cool-security.png" alt="COOL SECURITY"><button class="active" data-view="dashboard">▦ Resumen</button><button data-view="orders">▤ Pedidos <b id="pendingCount">0</b></button><button data-view="products">◫ Productos</button><button data-view="inventory">▥ Inventario</button><a href="tienda.html">↗ Ver tienda</a><a href="index.html">⌂ Página principal</a><button id="logoutButton">⇥ Cerrar sesión</button></aside><main><header><div><span>SISTEMA POS</span><h1 id="viewTitle">Resumen</h1></div><div class="sync" id="syncState"><i></i> Conectando…</div></header><section id="content"></section></main><dialog id="orderDialog"><div id="orderDetail"></div><button onclick="document.getElementById('orderDialog').close()">Cerrar</button></dialog><dialog id="productDialog"><form id="productForm"><h2 id="productFormTitle">Agregar producto</h2><input id="productId" type="hidden"><div class="product-form-grid"><label>Nombre<input id="productName" required></label><label>Categoría<input id="productCategory" required placeholder="Cámaras, Starlink, Redes…"></label><label>Precio RD$<input id="productPrice" type="number" min="0" step="1" required></label><label>Existencia<input id="productStock" type="number" min="0" step="1" required></label><label class="wide">Descripción<textarea id="productDescription" required></textarea></label><label class="wide">Foto del producto<input id="productImage" type="file" accept="image/*"><small>Selecciona una foto JPG, PNG o WEBP.</small></label><div class="wide image-preview"><img id="productPreview" alt="Vista previa"></div></div><div class="form-actions"><button type="button" class="action secondary" onclick="document.getElementById('productDialog').close()">Cancelar</button><button type="submit" class="action primary">Guardar producto</button></div><small id="productMessage"></small></form></dialog><div class="toast" id="posToast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="cloud.js"></script><script src="catalogo.js"></script><script src="pos.js"></script></body></html>
